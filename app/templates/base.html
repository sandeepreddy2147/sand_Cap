<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chicago Crime{% endblock %} | Chicago Crime</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Chicago Crime</a>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('crimes') }}" class="{{ 'active' if request.endpoint == 'crimes' }}">Crimes</a>
      <a href="{{ url_for('communities') }}" class="{{ 'active' if request.endpoint == 'communities' }}">Communities</a>
      <a href="{{ url_for('insights_page') }}" class="{{ 'active' if request.endpoint == 'insights_page' }}">Insights</a>
      <a href="{{ url_for('charts') }}" class="{{ 'active' if request.endpoint == 'charts' }}">Charts</a>
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Data: City of Chicago crime sample, 2012 to 2016</footer>
</body>
</html>
