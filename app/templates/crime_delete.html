{% extends "base.html" %}
{% block title %}Delete crime{% endblock %}
{% block content %}
<div class="panel error">
  <h1>Delete crime {{ crime.case_number }}?</h1>
  <p>{{ crime.date }}, {{ crime.primary_type }} at {{ crime.block }}. This cannot be undone.</p>
  <form method="post" class="form-buttons">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button type="submit" class="danger">Delete</button>
    <a class="button secondary" href="{{ url_for('crime_detail', crime_id=crime.id) }}">Cancel</a>
  </form>
</div>
{% endblock %}
